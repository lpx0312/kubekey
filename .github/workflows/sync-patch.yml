# 把私有 patch 打到官方新版本上, 编译二进制并发布到 GitHub Release。
#
# 触发方式: 手动 (workflow_dispatch), 在 Actions 页面输入官方版本号 (如 v4.0.6)。
#
# 完整流程 (一条流水线):
#   1. sync: 检出官方 tag → cherry-pick patch/port-fix → 打 vX.Y.Z-portfix tag → 推送
#   2. release: 基于该 tag checkout → GoReleaser 编译 6 个二进制 → 创建 GitHub Release
#
# 这个 workflow 必须存在于 port-fix 分支 (它引用的 patch/port-fix tag 在该分支上)。

name: Sync Patch

on:
  workflow_dispatch:
    inputs:
      version:
        description: "官方版本号 (如 v4.0.6)"
        required: true
        type: string
      push:
        description: "完成后推送 tag 并发布 Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: 同步 patch, 生成 vX.Y.Z-portfix tag
  # ─────────────────────────────────────────────────────────────
  sync-patch:
    name: "Sync patch → ${{ inputs.version }}"
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Checkout fork (full history + tags)
        uses: actions/checkout@v4
        with:
          # 用 PAT (需 workflows scope) 而非默认 GITHUB_TOKEN,
          # 否则 push 含 workflow 文件历史的 tag 时会被 GitHub 拦截:
          #   "refusing to allow a GitHub App to create or update workflow
          #    without workflows permission"
          # KK_PAT 是仓库 Secret, 见 README / PATCH-MAINTENANCE.md 说明。
          token: ${{ secrets.KK_PAT }}
          fetch-depth: 0
          fetch-tags: true
          ref: port-fix

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/kubesphere/kubekey.git
          git remote -v

      - name: Run sync-patch.sh
        id: meta
        env:
          SYNC_PROXY: ""
        run: |
          ARGS="${{ inputs.version }}"
          if [ "${{ inputs.push }}" != "true" ]; then
            ARGS="$ARGS --no-push"
          fi
          ./scripts/sync-patch.sh $ARGS

          # 把生成的 release tag 名透传给下游 release job
          RELEASE_TAG="${{ inputs.version }}-portfix"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "生成的发布 tag: $RELEASE_TAG"

  # ─────────────────────────────────────────────────────────────
  # Job 2: 基于新 tag 编译二进制 + 创建 GitHub Release
  # ─────────────────────────────────────────────────────────────
  release:
    name: "Release ${{ needs.sync-patch.outputs.release-tag }}"
    needs: sync-patch
    if: ${{ inputs.push == true }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.sync-patch.outputs.release-tag }}
    steps:
      - name: Checkout at the new -portfix tag
        uses: actions/checkout@v4
        with:
          # 用 PAT, 与 sync job 一致; GoReleaser 创建 Release 也用这个 token
          token: ${{ secrets.KK_PAT }}
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare ldflags
        id: prepare
        run: |
          LDFLAGS=$(bash hack/version.sh)
          echo "ldflags=${LDFLAGS}" >> "$GITHUB_OUTPUT"
          echo "ldflags: $LDFLAGS"

      # 幂等性: 若同名 Release 已存在 (重复运行同一版本时), 先删除旧的,
      # 让 GoReleaser 能重新创建。tag 本身由 sync job 已用 --force 更新。
      - name: Remove existing release (for idempotent re-runs)
        env:
          GH_TOKEN: ${{ secrets.KK_PAT }}
        run: |
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在, 删除后由 GoReleaser 重建"
            gh release delete "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || \
              gh release delete "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --yes
          else
            echo "Release $RELEASE_TAG 不存在, 跳过"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.5.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.KK_PAT }}
          LDFLAGS: ${{ steps.prepare.outputs.ldflags }}

      - name: Release info
        run: |
          echo "✅ Release 已创建: ${{ env.RELEASE_TAG }}"
          echo "产物 (GoReleaser 默认):"
          ls -lh dist/*.tar.gz dist/*checksums* 2>/dev/null || true
